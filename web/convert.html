<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TXD Converter — GTA SA DS</title>
<h1>TXD → DTXD Converter</h1>
<p>Conversion runs locally in this browser using the same C code as the CLI.</p>
<label>Original TXD file <input id="file" type="file" accept=".txd"></label>
<label>Scale <input id="scale" type="number" min="0.01" max="16" step="0.05" value="0.5"></label>
<label>Maximum size <input id="size" type="number" min="8" max="1024" value="128"></label>
<button id="build" type="button">Convert to DTXD</button>
<p id="status" role="status"></p>
<script type="module" src="./convert.js"></script>
</html>
