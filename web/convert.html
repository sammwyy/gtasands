<!doctype html>
<html lang="es">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Conversor TXD — GTA SA DS</title>
<h1>Conversor TXD → DTXD</h1>
<p>La conversión se realiza en este navegador con el mismo código C de la CLI.</p>
<label>Archivo TXD original <input id="file" type="file" accept=".txd"></label>
<label>Escala <input id="scale" type="number" min="0.01" max="16" step="0.05" value="0.5"></label>
<label>Tamaño máximo <input id="size" type="number" min="8" max="1024" value="128"></label>
<button id="build" type="button">Convertir DTXD</button>
<p id="status" role="status"></p>
<script type="module" src="./convert.js"></script>
</html>
