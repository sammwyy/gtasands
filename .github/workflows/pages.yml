name: Deploy installer

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pages.yml'
      - 'web/**'
      - 'tools/portable/**'
      - 'tools/mirror_rom_release.mjs'
      - 'tools/export_web_manifest.mjs'
      - 'resources.toml'
      - 'web/resources.json'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: emscripten-core/setup-emsdk@v15
        with:
          version: 5.0.1
      - name: Build browser converters
        run: make -f tools/portable/Makefile wasm
      - name: Mirror verified code-only release ROMs
        run: node tools/mirror_rom_release.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: web
      - uses: actions/deploy-pages@v4
        id: deployment
